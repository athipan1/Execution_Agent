name: Alpaca Connection Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-alpaca-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alpaca Connection Test
        env:
          ALPACA_CLIENT_ID: ${{ secrets.ALPACA_CLIENT_ID }}
          ALPACA_CLIENT_SECRET: ${{ secrets.ALPACA_CLIENT_SECRET }}
        run: python scripts/test_alpaca_connection.py
